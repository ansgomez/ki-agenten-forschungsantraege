# Default settings for the proposal pipeline (committed).
# Do not edit this file for personal settings. Run
#   python3 -m proposal_pipeline setup
# and put overrides in config.local.toml (git-ignored).
# Secrets (API keys, e-mail) go in .env, never here.

[paths]
projects_dir = "projects"       # where project folders live (git-ignored)

[search]                         # stage 04, Semantic Scholar
mode = "relevance"               # "relevance": plain keywords, max 100 hits/query
                                 # "bulk": Boolean syntax (+ | - "phrase" *), up to 1000 hits/query
year_from = 2015                 # 0 = no lower bound
year_to = 0                      # 0 = no upper bound
results_per_query = 10
pause_seconds = 5.0              # pause between queries; also the retry backoff on HTTP 429
fields_of_study = []             # e.g. ["Psychology", "Education"]; empty = all
min_citation_count = 0
open_access_only = false         # only return papers with a public PDF

[download]                       # stage 05, open-access full texts
max_papers = 50                  # process the first N search results
pause_seconds = 1.0
timeout_seconds = 60
use_unpaywall = true             # needs UNPAYWALL_EMAIL in .env
