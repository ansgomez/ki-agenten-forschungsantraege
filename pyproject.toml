[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proposal-pipeline"
version = "0.1.0"
description = "Multi-agent pipeline for writing research proposals, with a helper CLI for literature search and full-text download."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
dependencies = []

[project.scripts]
proposal-pipeline = "proposal_pipeline.cli:main"

[tool.setuptools]
packages = ["proposal_pipeline"]
